<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="pinShadowWater" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Pin Body -->
  <path d="M 60,132 C 58,110 20,80 20,52 A 40,40 0 1,1 100,52 C 100,80 62,110 60,132 Z" fill="url(#waterGrad)" filter="url(#pinShadowWater)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  <!-- Water Drop Icon -->
  <g fill="#FFFFFF" transform="translate(43, 26)">
    <path d="M 17,4 C 17,4 3,24 3,33 A 14,14 0 0,0 31,33 C 31,24 17,4 17,4 Z" />
    <!-- Highlight Reflection -->
    <ellipse cx="11" cy="33" rx="3.5" ry="5" fill="#BFDBFE" opacity="0.7" transform="rotate(-22 11 33)" />
  </g>
</svg>