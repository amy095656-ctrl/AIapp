<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="toiletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="pinShadowToilet" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <!-- Pin Body -->
  <path d="M 60,132 C 58,110 20,80 20,52 A 40,40 0 1,1 100,52 C 100,80 62,110 60,132 Z" fill="url(#toiletGrad)" filter="url(#pinShadowToilet)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  <!-- Dedicated Toilet Icon (Matching water drop weight & style) -->
  <g fill="#FFFFFF" transform="translate(39, 29)">
    <!-- Water Tank & Lid -->
    <rect x="2" y="2" width="11" height="24" rx="2.5" />
    <rect x="0.5" y="0" width="14" height="3.5" rx="1.75" />
    <circle cx="10.5" cy="5" r="1.2" fill="#0F766E" />
    <!-- Bowl & Seat -->
    <path d="M 13,13 L 37,13 C 39.5,13 41.5,15 41.5,17.5 C 41.5,19.5 39.5,21 37,21 L 13,21 Z" />
    <path d="M 13,21 C 13,31.5 36,31.5 36.5,21 Z" />
    <!-- Pedestal Base -->
    <path d="M 16,30 L 14,40 C 13.5,42 11,43 9,43 L 32,43 C 30,43 27.5,42 27,40 L 25,30 Z" />
  </g>
</svg>